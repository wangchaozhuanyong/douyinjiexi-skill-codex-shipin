<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蚂蚁AI 热榜银河预览</title>
  <style>
    :root {
      --glass-alpha: 0.26;
      --quality: 1;
      --stage-w: min(54vh, 92vw);
      --stage-h: calc(var(--stage-w) * 16 / 9);
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 18%, rgba(56, 130, 210, 0.18), transparent 26%),
        radial-gradient(circle at 86% 30%, rgba(215, 78, 170, 0.16), transparent 24%),
        #050812;
      color: #ecf8ff;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .workspace {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: minmax(320px, var(--stage-w)) minmax(280px, 360px);
      gap: 24px;
      align-items: center;
      justify-content: center;
    }

    .stage {
      width: var(--stage-w);
      height: var(--stage-h);
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      background: #030711;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.48), 0 0 0 1px rgba(168, 231, 255, 0.16);
      isolation: isolate;
    }

    .stage video,
    .stage .quality-layer,
    .stage .grain-layer,
    .stage .copy-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .stage video {
      object-fit: cover;
      filter: saturate(calc(1.04 * var(--quality))) contrast(1.08) brightness(0.94);
      transform: none;
    }

    .quality-layer {
      pointer-events: none;
      background:
        radial-gradient(circle at 54% 39%, rgba(96, 198, 255, calc(0.18 * var(--quality))), transparent 22%),
        radial-gradient(circle at 70% 66%, rgba(238, 76, 174, calc(0.10 * var(--quality))), transparent 24%),
        radial-gradient(ellipse at center, transparent 48%, rgba(0, 0, 0, 0.54) 100%);
      mix-blend-mode: screen;
      opacity: 0.72;
      z-index: 2;
    }

    .grain-layer {
      pointer-events: none;
      opacity: calc(0.12 * var(--quality));
      z-index: 3;
      background-image:
        radial-gradient(circle at 13% 19%, rgba(255,255,255,0.55) 0 1px, transparent 1.5px),
        radial-gradient(circle at 41% 58%, rgba(255,255,255,0.35) 0 1px, transparent 1.4px),
        radial-gradient(circle at 77% 36%, rgba(255,255,255,0.42) 0 1px, transparent 1.6px);
      background-size: 37px 41px, 53px 47px, 71px 67px;
      animation: dustDrift 18s linear infinite;
    }

    @keyframes dustDrift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-37px, 21px, 0); }
    }

    .copy-layer {
      z-index: 4;
      display: grid;
      grid-template-rows: 24% 50% 26%;
      padding: 7.5% 7.5% 8%;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
    }

    .topline {
      align-self: end;
    }

    .date-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      color: #dff7ff;
      background: rgba(5, 18, 42, 0.30);
      border: 1px solid rgba(174, 234, 255, 0.20);
      backdrop-filter: blur(5px);
      font-size: clamp(13px, 1.8vh, 18px);
      letter-spacing: 0;
    }

    .glass-card {
      align-self: center;
      min-height: 39%;
      border-radius: 36px;
      padding: clamp(22px, 3.1vh, 36px);
      background: rgba(3, 10, 24, var(--glass-alpha));
      border: 1px solid rgba(160, 231, 255, 0.18);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 -24px 60px rgba(90, 170, 255, 0.08),
        0 22px 70px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(5px) saturate(1.14);
      transition: opacity 180ms ease, background-color 180ms ease;
    }

    .glass-card.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .mark {
      font-size: clamp(36px, 5.4vh, 76px);
      line-height: 1;
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(33px, 5.2vh, 78px);
      line-height: 1.08;
      letter-spacing: 0;
      color: #f4fbff;
    }

    .subtitle {
      width: fit-content;
      margin: 14px auto 24px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(8, 24, 52, 0.28);
      border: 1px solid rgba(180, 232, 255, 0.16);
      color: rgba(236, 248, 255, 0.88);
      font-weight: 700;
      letter-spacing: 0;
      font-size: clamp(13px, 1.9vh, 22px);
    }

    .rank-list {
      display: grid;
      gap: 10px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 12px;
      align-items: center;
      min-height: 54px;
      padding: 8px 14px;
      border-radius: 18px;
      background: rgba(7, 20, 45, 0.24);
      border: 1px solid rgba(185, 237, 255, 0.12);
    }

    .rank-row b {
      color: #7ee8ff;
      font-size: clamp(15px, 2vh, 22px);
    }

    .rank-row span {
      color: rgba(240, 250, 255, 0.92);
      font-size: clamp(14px, 1.95vh, 21px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer-lock {
      align-self: end;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: rgba(233, 248, 255, 0.92);
      font-size: clamp(15px, 2.2vh, 28px);
      font-weight: 800;
    }

    .progress {
      height: 4px;
      flex: 1;
      border-radius: 999px;
      background: linear-gradient(90deg, #58d8ff, #ff5aa8);
      box-shadow: 0 0 18px rgba(90, 213, 255, 0.55);
    }

    .controls {
      border-radius: 18px;
      padding: 18px;
      background: rgba(5, 10, 22, 0.58);
      border: 1px solid rgba(171, 229, 255, 0.16);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(12px);
    }

    .controls h2 {
      margin: 0 0 16px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .field {
      display: grid;
      gap: 8px;
      margin: 14px 0;
    }

    label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: rgba(235, 247, 255, 0.88);
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #6ee7ff;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      min-height: 42px;
      color: #06101e;
      background: linear-gradient(135deg, #8beeff, #ff8bc1);
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      color: #eaf8ff;
      background: rgba(160, 229, 255, 0.12);
      border: 1px solid rgba(170, 233, 255, 0.18);
    }

    .status {
      margin-top: 12px;
      min-height: 20px;
      color: rgba(228, 244, 255, 0.74);
      font-size: 13px;
    }

    canvas {
      display: none;
    }

    @media (max-width: 860px) {
      body {
        padding: 14px;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      :root {
        --stage-w: min(58vh, 100vw - 28px);
      }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <section class="stage" aria-label="蚂蚁AI 热榜银河模板预览">
      <video id="backgroundVideo" autoplay muted loop playsinline poster="../../assets/ai_background_templates_dynamic/BG_DYNAMIC_11_蚂蚁AI热榜星云_9x16.poster.png">
        <source src="../../assets/ai_background_templates_dynamic/BG_DYNAMIC_11_蚂蚁AI热榜星云_9x16.mp4" type="video/mp4" />
      </video>
      <div class="quality-layer"></div>
      <div class="grain-layer"></div>
      <div class="copy-layer">
        <div class="topline">
          <span class="date-chip">7.1 · AI HOTLIST</span>
        </div>
        <article id="glassCard" class="glass-card">
          <div class="mark">🔥</div>
          <h1>蚂蚁AI 热榜 TOP5</h1>
          <div class="subtitle">AI 今日热榜</div>
          <div class="rank-list">
            <div class="rank-row"><b>TOP1</b><span>OpenAI 模型预览信号</span></div>
            <div class="rank-row"><b>TOP2</b><span>Agent 评估流程升级</span></div>
            <div class="rank-row"><b>TOP3</b><span>多模态工具链继续下沉</span></div>
          </div>
        </article>
        <div class="footer-lock">
          <span>关注 蚂蚁AI</span>
          <i class="progress" aria-hidden="true"></i>
        </div>
      </div>
    </section>

    <aside class="controls" aria-label="模板预览控制">
      <h2>Galaxy Renderer</h2>
      <div class="field">
        <label for="alpha">卡片透明度 <span id="alphaValue">0.26</span></label>
        <input id="alpha" type="range" min="0.24" max="0.34" step="0.01" value="0.26" />
      </div>
      <div class="field">
        <label for="speed">银河速度 <span id="speedValue">1.00x</span></label>
        <input id="speed" type="range" min="0.65" max="1.35" step="0.05" value="1" />
      </div>
      <div class="field">
        <label for="quality">质感强度 <span id="qualityValue">1.00</span></label>
        <input id="quality" type="range" min="0.60" max="1.25" step="0.05" value="1" />
      </div>
      <div class="buttons">
        <button id="togglePlay" type="button">暂停</button>
        <button id="toggleCard" class="secondary" type="button">隐藏卡片</button>
        <button id="exportFrame" class="secondary" type="button">导出帧</button>
        <button id="recordPreview" type="button">录制6秒</button>
      </div>
      <div id="status" class="status"></div>
    </aside>
  </main>
  <canvas id="exportCanvas" width="1080" height="1920"></canvas>

  <script>
    const root = document.documentElement;
    const video = document.getElementById("backgroundVideo");
    const card = document.getElementById("glassCard");
    const alpha = document.getElementById("alpha");
    const speed = document.getElementById("speed");
    const quality = document.getElementById("quality");
    const statusNode = document.getElementById("status");
    const canvas = document.getElementById("exportCanvas");
    const ctx = canvas.getContext("2d");

    function setStatus(text) {
      statusNode.textContent = text;
    }

    function updateControls() {
      root.style.setProperty("--glass-alpha", alpha.value);
      root.style.setProperty("--quality", quality.value);
      video.playbackRate = Number(speed.value);
      document.getElementById("alphaValue").textContent = Number(alpha.value).toFixed(2);
      document.getElementById("speedValue").textContent = Number(speed.value).toFixed(2) + "x";
      document.getElementById("qualityValue").textContent = Number(quality.value).toFixed(2);
    }

    function roundRect(context, x, y, width, height, radius) {
      context.beginPath();
      context.moveTo(x + radius, y);
      context.arcTo(x + width, y, x + width, y + height, radius);
      context.arcTo(x + width, y + height, x, y + height, radius);
      context.arcTo(x, y + height, x, y, radius);
      context.arcTo(x, y, x + width, y, radius);
      context.closePath();
    }

    function drawOverlayForExport() {
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.fillRect(0, 0, 1080, 1920);
      if (!card.classList.contains("hidden")) {
        const a = Number(alpha.value);
        roundRect(ctx, 81, 595, 999, 1338 - 595, 36);
        ctx.fillStyle = `rgba(3, 10, 24, ${a})`;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(170, 232, 255, 0.18)";
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = "#f5fbff";
        ctx.shadowColor = "rgba(0,0,0,0.78)";
        ctx.shadowBlur = 24;
        ctx.font = "700 82px PingFang SC, Microsoft YaHei, sans-serif";
        ctx.fillText("蚂蚁AI 热榜 TOP5", 540, 830);
        ctx.font = "700 34px PingFang SC, Microsoft YaHei, sans-serif";
        ctx.fillStyle = "rgba(235,248,255,0.88)";
        ctx.fillText("AI 今日热榜", 540, 925);
        const rows = ["TOP1  OpenAI 模型预览信号", "TOP2  Agent 评估流程升级", "TOP3  多模态工具链继续下沉"];
        ctx.textAlign = "left";
        ctx.font = "700 34px PingFang SC, Microsoft YaHei, sans-serif";
        rows.forEach((line, index) => ctx.fillText(line, 225, 1070 + index * 78));
      }
      ctx.textAlign = "left";
      ctx.font = "800 36px PingFang SC, Microsoft YaHei, sans-serif";
      ctx.fillStyle = "#eaf8ff";
      ctx.fillText("关注 蚂蚁AI", 84, 1715);
      ctx.shadowBlur = 0;
    }

    function drawExportFrame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      drawOverlayForExport();
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    alpha.addEventListener("input", updateControls);
    speed.addEventListener("input", updateControls);
    quality.addEventListener("input", updateControls);

    document.getElementById("togglePlay").addEventListener("click", async (event) => {
      if (video.paused) {
        await video.play();
        event.currentTarget.textContent = "暂停";
      } else {
        video.pause();
        event.currentTarget.textContent = "播放";
      }
    });

    document.getElementById("toggleCard").addEventListener("click", (event) => {
      card.classList.toggle("hidden");
      event.currentTarget.textContent = card.classList.contains("hidden") ? "显示卡片" : "隐藏卡片";
    });

    document.getElementById("exportFrame").addEventListener("click", () => {
      drawExportFrame();
      canvas.toBlob((blob) => {
        if (!blob) return;
        downloadBlob(blob, "ant-ai-hotlist-galaxy-preview-frame.png");
        setStatus("已导出当前封面帧");
      }, "image/png");
    });

    document.getElementById("recordPreview").addEventListener("click", () => {
      const chunks = [];
      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: "video/webm" });
      let start = null;
      function tick(time) {
        if (!start) start = time;
        drawExportFrame();
        if (time - start < 6000 && recorder.state === "recording") {
          requestAnimationFrame(tick);
        }
      }
      recorder.ondataavailable = (event) => {
        if (event.data.size) chunks.push(event.data);
      };
      recorder.onstop = () => {
        downloadBlob(new Blob(chunks, { type: "video/webm" }), "ant-ai-hotlist-galaxy-6s-preview.webm");
        setStatus("已导出 6 秒动态预览");
      };
      recorder.start();
      requestAnimationFrame(tick);
      setTimeout(() => recorder.stop(), 6200);
      setStatus("正在录制 6 秒预览");
    });

    updateControls();
    video.play().catch(() => setStatus("点击播放后可预览动态背景"));
  </script>
</body>
</html>
