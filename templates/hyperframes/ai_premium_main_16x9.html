<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="../../assets/hyperframes_components/premium_foreground_modules.css">
  <style>
    :root {
      --stage-w: 1920px;
      --stage-h: 1080px;
      --caption-h: 136px;
      --safe-x: 96px;
      --safe-y: 72px;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #02070b;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    #composition {
      position: relative;
      width: var(--stage-w);
      height: var(--stage-h);
      overflow: hidden;
      color: #f5fbff;
      background: #02070b;
    }

    .hf-bg {
      position: absolute;
      inset: 0;
      background-image: url("{{BACKGROUND_IMAGE}}");
      background-size: cover;
      background-position: center;
      transform: scale(1.018);
    }

    .hf-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 28% 18%, rgba(101, 232, 255, 0.12), transparent 26%),
        radial-gradient(circle at 78% 70%, rgba(244, 198, 111, 0.1), transparent 28%),
        linear-gradient(180deg, rgba(1, 6, 10, 0.18), rgba(1, 6, 10, 0.54));
    }

    .hf-scene-stack {
      position: absolute;
      inset: var(--safe-y) var(--safe-x) calc(var(--caption-h) + 28px);
    }

    .hf-scene {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
    }

    .hf-scene[data-active="true"] {
      opacity: 1;
      pointer-events: auto;
    }

    .hf-caption-band {
      position: absolute;
      left: var(--safe-x);
      right: var(--safe-x);
      bottom: 42px;
      min-height: 92px;
      display: grid;
      align-items: center;
      padding: 0 34px;
      color: #f8fcff;
      font-size: 34px;
      line-height: 1.24;
      background: linear-gradient(90deg, rgba(4, 13, 20, 0.82), rgba(12, 28, 40, 0.7));
      border: 1px solid rgba(101, 232, 255, 0.24);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 18px 70px rgba(0, 0, 0, 0.32);
    }

    .hf-transition-veil,
    .hf-transition-chip,
    .hf-prism-plate,
    .hf-proof-lens,
    .hf-semantic-node,
    .hf-lock-ring,
    .hf-final-template {
      position: absolute;
      pointer-events: none;
      opacity: 0;
    }

    .hf-transition-veil {
      inset: 0;
      background: linear-gradient(90deg, rgba(5, 15, 24, 0), rgba(101, 232, 255, 0.18), rgba(244, 198, 111, 0.14), rgba(5, 15, 24, 0));
      transform: scaleX(0);
    }

    .hf-transition-chip {
      left: 50%;
      top: 50%;
      width: 360px;
      height: 84px;
      margin-left: -180px;
      margin-top: -42px;
      display: grid;
      place-items: center;
      color: #061018;
      background: linear-gradient(180deg, #dff8ff, #6ee8ff);
      font-weight: 760;
      font-size: 24px;
      letter-spacing: 0;
      box-shadow: 0 0 44px rgba(101, 232, 255, 0.36);
    }

    .hf-frame-zero-cover {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background-image: url("{{COVER_BACKGROUND_IMAGE}}");
      background-size: cover;
      background-position: center;
    }

    .hf-cover-copy {
      width: 1080px;
      max-width: 1080px;
      text-align: center;
      transform: translateY(-8px);
    }

    .hf-cover-copy h1 {
      margin: 0;
      color: #f8fcff;
      font-size: 76px;
      line-height: 1.08;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .hf-cover-copy p {
      margin: 22px 0 0;
      color: rgba(231, 240, 245, 0.82);
      font-size: 34px;
      line-height: 1.18;
    }
  </style>
</head>
<body>
  <main id="composition" data-width="1920" data-height="1080" data-fps="30" data-cover-frame-count="1">
    <div class="hf-bg" aria-hidden="true"></div>
    <section class="hf-scene-stack" id="scene-stack">
      {{SCENES_HTML}}
    </section>
    <section class="hf-caption-band" id="caption-band">{{INITIAL_CAPTION}}</section>
    <div class="hf-transition-veil" aria-hidden="true"></div>
    <div class="hf-transition-chip" aria-hidden="true">{{HANDOFF_LABEL}}</div>
    <section class="hf-frame-zero-cover" id="frame-zero-cover" data-frame-zero-only="true">
      <div class="hf-cover-copy">
        <h1>{{COVER_TITLE}}</h1>
        <p>{{COVER_SUBTITLE}}</p>
      </div>
    </section>
  </main>
  <script src="../../assets/hyperframes_components/advanced_motion_templates.js"></script>
  <script src="../../assets/hyperframes_components/premium_foreground_modules.js"></script>
  <script>
    window.__AI_PREMIUM_SCENES__ = {{SCENE_DATA_JSON}};
    window.__AI_PREMIUM_MOTION__ = {{MOTION_PLAN_JSON}};

    (function () {
      var cover = document.getElementById("frame-zero-cover");
      var scenes = Array.prototype.slice.call(document.querySelectorAll(".hf-scene"));
      var caption = document.getElementById("caption-band");

      function setFrame(frame) {
        if (cover) cover.style.display = frame === 0 ? "grid" : "none";
        if (frame === 1 && scenes[0]) scenes[0].dataset.active = "true";
      }

      function activateScene(sceneId, captionText) {
        scenes.forEach(function (scene) {
          scene.dataset.active = scene.dataset.sceneId === sceneId ? "true" : "false";
        });
        if (caption && captionText) caption.textContent = captionText;
      }

      function bootTimeline() {
        if (!window.AdvancedMotionTemplates) throw new Error("AdvancedMotionTemplates runtime missing.");
        var report = window.AdvancedMotionTemplates.validateRegistry();
        if (!report.ok) throw new Error(report.issues.join("; "));
        if (window.PremiumForegroundModules) window.PremiumForegroundModules.init(document);
        var motion = window.__AI_PREMIUM_MOTION__ || { entrances: [], transitions: [] };
        window.__AI_PREMIUM_TIMELINE__ = window.AdvancedMotionTemplates.buildTimeline(motion);
      }

      window.AIPremiumMainTemplate = {
        setFrame: setFrame,
        activateScene: activateScene,
        bootTimeline: bootTimeline
      };

      setFrame(0);
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bootTimeline);
      } else {
        bootTimeline();
      }
    })();
  </script>
</body>
</html>
